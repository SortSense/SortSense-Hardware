name: CI - SortSense Hardware Firmware & Unit Tests

on:
  push:
    branches:
      - main
      - cases
      - 'feat/**'
  pull_request:
    branches:
      - main
      - cases
      - 'feat/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: PlatformIO Unit Tests & Firmware Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Run Host-Native Unit Tests (Unity)
        run: |
          pio test -e native

      - name: Build ESP32-S3 Target Firmware
        run: |
          pio run -e esp32-s3-devkitc-1
