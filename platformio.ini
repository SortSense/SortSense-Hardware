; =============================================================================
; SortSense Smart Waste Classification System - ESP32-S3 Firmware Configuration
; Hardware Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM) + OV5640 CAM
; PlatformIO Environment Configuration
; =============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_ignore = *

; --- SERIAL MONITOR CONFIGURATION ---
monitor_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; --- MEMORY OVERRIDES (Unlocking the N16R8 Hardware) ---
; Directs PlatformIO to utilize the 16MB Flash and custom 16MB partition layout
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; --- BUILD FLAGS TO UNLOCK HARDWARE CAPABILITIES ---
build_flags = 
    -DBOARD_HAS_PSRAM            ; CRITICAL: Unlocks the 8MB Octal PSRAM for Camera Frame Buffers
    -DARDUINO_USB_MODE=1         ; Configures hardware USB OTG / CDC mode
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Routes Serial to UART port (/dev/ttyUSB0) so monitor works on UART Type-C port
    -DCORE_DEBUG_LEVEL=0         ; No debug logs in tasks (guarantees cam_task zero stack overflow)
